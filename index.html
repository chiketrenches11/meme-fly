<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEME FLY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- =========================
         MAIN MENU
    ========================== -->

    <section id="menu">

        <div class="floating-meme meme1">🐸</div>
        <div class="floating-meme meme2">🐕</div>
        <div class="floating-meme meme3">🪙</div>
        <div class="floating-meme meme4">🚀</div>
        <div class="floating-meme meme5">💎</div>
        <div class="floating-meme meme6">📈</div>

        <div class="coin coin1">🪙</div>
        <div class="coin coin2">🪙</div>
        <div class="coin coin3">🪙</div>

        <div class="logo">

            <div>MEME</div>

            <div class="logoFly">
                FLY
            </div>

        </div>

        <div class="tagline">
            THE MEMECOIN ARCADE
        </div>

        <div class="menuButtons">

            <button id="playBtn">
                🚀 PLAY
            </button>

            <button id="levelsBtn">
                🗺️ WORLDS
            </button>

        </div>

        <div class="stats">

            <div>
                🏆
                <span>BEST</span>
                <strong id="bestScore">0</strong>
            </div>

            <div>
                🪙
                <span>COINS</span>
                <strong id="coins">0</strong>
            </div>

        </div>

        <div class="version">
            MEME FLY v1.0
        </div>

    </section>


    <!-- =========================
         WORLD SELECT
    ========================== -->

    <section id="levelsScreen" class="hidden">

        <div class="worldHeader">

            <div class="smallLogo">
                MEME FLY
            </div>

            <h1>
                CHOOSE YOUR WORLD
            </h1>

            <p>
                Unlock the next memecoin universe.
            </p>

        </div>

        <div id="levelContainer"></div>

        <button id="backBtn" class="backButton">
            ← BACK
        </button>

    </section>


    <!-- =========================
         GAME
    ========================== -->

    <section id="game" class="hidden">

        <canvas id="gameCanvas"></canvas>

        <div id="hud">

            <div class="hudItem">
                <span>WORLD</span>
                <strong id="currentLevel">1</strong>
            </div>

            <div class="hudItem">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="hudItem">
                <span>🪙</span>
                <strong id="gameCoins">0</strong>
            </div>

        </div>


        <!-- GAME OVER -->

        <div id="gameOver" class="overlay hidden">

            <div class="overlayIcon">
                💥
            </div>

            <h2>
                WASTED!
            </h2>

            <p>
                Your meme journey ends here.
            </p>

            <div class="result">

                SCORE
                <strong id="finalScore">0</strong>

            </div>

            <div class="overlayButtons">

                <button id="retryBtn">
                    🔄 RETRY
                </button>

                <button id="menuBtn">
                    🏠 MENU
                </button>

            </div>

        </div>


        <!-- LEVEL COMPLETE -->

        <div id="levelComplete" class="overlay hidden">

            <div class="overlayIcon">
                🏆
            </div>

            <h2>
                WORLD CLEARED!
            </h2>

            <p>
                The next memecoin universe is unlocked.
            </p>

            <div class="result">

                SCORE
                <strong id="completeScore">0</strong>

            </div>

            <div class="overlayButtons">

                <button id="nextBtn">
                    🚀 NEXT WORLD
                </button>

                <button id="levelsBtn2">
                    🗺️ WORLDS
                </button>

            </div>

        </div>

    </section>

</div>

<script src="game.js"></script>

</body>
</html>
